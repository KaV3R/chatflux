# SPDX-License-Identifier: AGPL-3.0-or-later
# ChatFlux: builds the Windows desktop installer and publishes it as a GitHub Release.
# Simplified from build-desktop.yaml: Windows x64 only, no code signing, no update feed.
name: ChatFlux desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: chatflux-desktop-windows
  cancel-in-progress: false

env:
  BUILD_CHANNEL: stable

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          # CalVer like upstream: YYYY.MDD.HHMMSS (UTC, no leading zeroes)
          y=$(date -u +%Y); m=$((10#$(date -u +%m))); d=$(date -u +%d); t=$((10#$(date -u +%H%M%S)))
          echo "version=${y}.${m}${d}.${t}" >> "$GITHUB_OUTPUT"

  shared_assets:
    name: Build renderer
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _ci

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      - name: Set workdir
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_workdir_unix

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Set up pnpm
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step setup_pnpm

      - name: Resolve pnpm store path
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step resolve_pnpm_store_unix

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-renderer-pnpm-${{ hashFiles('source/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-renderer-pnpm-

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_build_channel

      - name: Build renderer assets
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_shared_assets

      - name: Prepare renderer artifact
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step prepare_shared_assets

      - name: Upload renderer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-${{ needs.meta.outputs.version }}
          path: source/desktop-shared-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Build Windows installer
    needs: [meta, shared_assets]
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      BUILD_VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      FLUXER_MODULES: "1"
      PLATFORM: windows
      DESKTOP_PLATFORM: windows
      ARCH: x64
      DESKTOP_ARCH: x64
      ELECTRON_ARCH: x64
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _ci

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Ensure python3 command
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step ensure_python3_windows

      - name: Shorten Windows paths and pin pnpm store
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step windows_paths

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Set up pnpm
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step setup_pnpm

      - name: Resolve pnpm store path
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step resolve_pnpm_store_windows

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-x64-pnpm-${{ hashFiles('source/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-x64-pnpm-

      - name: Set up MSVC env
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: amd64

      - name: Set up Rust targets
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_rust_windows_targets

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_build_channel

      - name: Download renderer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-${{ needs.meta.outputs.version }}
          path: source/desktop-shared-assets

      - name: Restore renderer assets
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step restore_shared_assets

      - name: Build Electron main process
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_electron_main

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Install Velopack CLI
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_velopack_cli

      - name: Build Electron app
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_app_windows

      - name: Create portable ZIP
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step create_portable_zip_windows

      - name: Package installer with Velopack (unsigned)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packDir = Get-ChildItem dist-electron -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'ChatFlux.exe') } | Select-Object -First 1
          if (-not $packDir) { throw 'Unpacked app with ChatFlux.exe not found in dist-electron' }
          & .\.velopack\vpk.exe --yes pack `
            --packId chatflux_desktop `
            --packVersion $env:BUILD_VERSION `
            --packDir $packDir.FullName `
            --mainExe ChatFlux.exe `
            --packTitle ChatFlux `
            --packAuthors CatFlux `
            --shortcuts Desktop,StartMenu `
            --runtime win-x64 `
            --icon build_resources/icons-stable/icon.ico `
            --outputDir dist-electron/velopack `
            --delta None
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem dist-electron/velopack -Filter '*Setup.exe' | Select-Object -First 1
          Copy-Item $setup.FullName "release/ChatFlux-Setup-$($env:BUILD_VERSION)-x64.exe"
          Get-ChildItem dist-electron -Filter '*portable*.zip' | Copy-Item -Destination release/
          Get-ChildItem release

      - name: Publish GitHub release
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "desktop-v$($env:BUILD_VERSION)"
          gh release create $tag (Get-ChildItem release).FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ChatFlux $($env:BUILD_VERSION)" `
            --notes "ChatFlux Windows telepítő. Töltsd le a ChatFlux-Setup fájlt és futtasd. Ha a Windows figyelmeztet: További információ -> Futtatás mindenképp." `
            --latest

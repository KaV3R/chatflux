# ChatFlux: builds the nudity detector used by the media proxy and pushes it to
# ghcr.io/<owner>/chatflux-nsfw:latest (FLUXER_NSFW_SERVICE_ENDPOINT).
name: ChatFlux NSFW detector image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chatflux-nsfw
  cancel-in-progress: false

jobs:
  build:
    name: Build and push NSFW detector image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          y=$(date -u +%Y); m=$((10#$(date -u +%m))); d=$(date -u +%d); t=$((10#$(date -u +%H%M%S)))
          echo "version=${y}.${m}${d}.${t}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --no-show-signature --pretty=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: chatflux_nsfw/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/chatflux-nsfw:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/chatflux-nsfw:${{ steps.meta.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_SHA=${{ github.sha }}
            SOURCE_DATE=${{ steps.meta.outputs.date }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

# SPDX-License-Identifier: AGPL-3.0-or-later
# ChatFlux: builds our own web app image (fluxer-app-proxy-self-hosted) and pushes it to
# ghcr.io/<owner>/fluxer-app-proxy-self-hosted:chatflux. Simplified from build-app-proxy-self-hosted.yaml.
name: ChatFlux web image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chatflux-web
  cancel-in-progress: false

jobs:
  build:
    name: Build and push web image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          y=$(date -u +%Y); m=$((10#$(date -u +%m))); d=$(date -u +%d); t=$((10#$(date -u +%H%M%S)))
          echo "version=${y}.${m}${d}.${t}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --no-show-signature --pretty=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"

      - name: Prepare docker config
        run: tools/ci/run.sh build-app-proxy --step prepare_docker_config

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Configure ghcr auth
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/ci/run.sh build-app-proxy --step configure_ghcr_auth

      - name: Build the asset image
        env:
          GHCR_OWNER: ${{ steps.meta.outputs.owner }}
          IMAGE_REPO: ghcr.io/${{ steps.meta.outputs.owner }}/fluxer-app-proxy-self-hosted
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          PUBLIC_ASSET_BASE_URL: ""
          BUNDLE_LOCAL_ASSETS: "true"
          CACHE_FROM: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/fluxer-app-proxy-self-hosted:buildcache-dist
          CACHE_TO: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/fluxer-app-proxy-self-hosted:buildcache-dist,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        run: tools/ci/run.sh build-app-proxy --step build_dist

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: fluxer_app_proxy/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/fluxer-app-proxy-self-hosted:chatflux
            ghcr.io/${{ steps.meta.outputs.owner }}/fluxer-app-proxy-self-hosted:chatflux-${{ steps.meta.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_SHA=${{ github.sha }}
            SOURCE_DATE=${{ steps.meta.outputs.date }}
            FLUXER_SELF_HOSTED=true
            APP_ASSETS_REF=ghcr.io/${{ steps.meta.outputs.owner }}/fluxer-app-proxy-self-hosted:${{ steps.meta.outputs.version }}-assets
            APP_ASSETS_PLATFORM=linux/amd64
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
